name: CI Builder

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build release APK'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install Android NDK & CMake
        run: |
          # Accept licenses automatically before installing
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_HOME} "ndk;29.0.14206865" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-34"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/keystore.jks

      - name: Build debug APK
        if: ${{ github.event.inputs.build_release != 'true' }}
        env:
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASS \
            -Pandroid.injected.signing.key.alias=$ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS \
            --stacktrace --no-daemon

      - name: Build release APK
        if: ${{ github.event.inputs.build_release == 'true' }}
        env:
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/keystore.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASS \
            -Pandroid.injected.signing.key.alias=$ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASS \
            --stacktrace --no-daemon

      - name: Report
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload debug APK Artifact
        if: ${{ github.event.inputs.build_release != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorMali-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK Artifact
        if: ${{ github.event.inputs.build_release == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WinlatorMali-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
